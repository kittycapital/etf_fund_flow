<style>
:root {
  --bg-primary: #000000;
  --bg-card: #0d0d0d;
  --bg-hover: #1a1a1a;
  --border: #1a1a1a;
  --text-primary: #e8e8f0;
  --text-secondary: #888888;
  --text-muted: #555555;
  --accent-cyan: #22d3ee;
  --accent-green: #22c55e;
  --accent-red: #ef4444;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
::-webkit-scrollbar { display: none; }
* { -ms-overflow-style: none; scrollbar-width: none; }
html, body { overflow-x: hidden; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }

.header { text-align: center; padding: 30px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
.header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.header .subtitle { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); margin-top: 6px; }

.controls { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; align-items: flex-end; justify-content: center; }
.control-group { display: flex; flex-direction: column; gap: 6px; }
.control-group label { font-size: 11px; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; text-align: center; }
.control-group select { font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 8px 12px; background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; min-width: 180px; }
.control-group select:focus { outline: none; border-color: var(--accent-cyan); }

.window-buttons { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.window-btn { font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 8px 14px; background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: all 0.15s; }
.window-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.window-btn.active { background: var(--accent-cyan); color: #000; border-color: var(--accent-cyan); font-weight: 600; }

.info-bar { display: flex; gap: 24px; margin-bottom: 20px; padding: 12px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; flex-wrap: wrap; justify-content: center; }
.info-item { display: flex; flex-direction: column; gap: 2px; align-items: center; }
.info-item .label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.info-item .value { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; }
.info-item .value.positive { color: var(--accent-green); }
.info-item .value.negative { color: var(--accent-red); }

.divergence-alert { display: none; margin-bottom: 16px; padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; align-items: center; gap: 8px; justify-content: center; }
.divergence-alert.bullish { display: flex; background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.25); color: var(--accent-green); }
.divergence-alert.bearish { display: flex; background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); color: var(--accent-red); }

.chart-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
.chart-title { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.chart-title .dot { width: 8px; height: 8px; border-radius: 50%; }
.chart-title .dot.cyan { background: var(--accent-cyan); }
.chart-title .dot.green { background: var(--accent-green); }
.chart-wrapper { position: relative; height: 300px; }

.flow-legend { display: flex; gap: 16px; margin-top: 8px; font-size: 11px; color: var(--text-muted); justify-content: center; }
.flow-legend span { display: flex; align-items: center; gap: 4px; }
.flow-legend .box { width: 12px; height: 12px; border-radius: 2px; }
.flow-legend .box.inflow { background: rgba(34,197,94,0.4); border: 1px solid var(--accent-green); }
.flow-legend .box.outflow { background: rgba(239,68,68,0.4); border: 1px solid var(--accent-red); }

.share-group { display: flex; justify-content: center; gap: 8px; margin: 20px 0; }
.share-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border: 1px solid var(--border); border-radius: 20px; background: var(--bg-card); color: var(--text-secondary); font-family: 'Noto Sans KR', sans-serif; font-size: 12px; cursor: pointer; transition: all 0.15s; text-decoration: none; }

.signal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.signal-col { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.signal-col-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }

.signal-flow.green { color: var(--accent-green); }
.signal-mult { font-family: 'JetBrains Mono', monospace; font-size: 10px; }

.signal-empty { font-size: 12px; color: var(--text-muted); text-align: center; padding: 12px 0; }
.signal-loading { font-size: 11px; color: var(--text-muted); text-align: center; padding: 10px 0; font-family: 'JetBrains Mono', monospace; }
@media (max-width: 600px) {

.footer { margin-top: 32px; padding: 16px 0; border-top: 1px solid var(--border); text-align: center; font-size: 11px; color: var(--text-muted); }

@media (max-width: 768px) {
  .container { padding: 12px; }

  .chart-wrapper { height: 220px; }
  .share-group { flex-wrap: wrap; }
  .share-btn { font-size: 11px; padding: 6px 10px; }
}
</style>

}
function doShare(platform) {
  const t = `${currentTicker} (${findTickerName(currentTicker)}) ETF 자금 레이더 - Herdvibe`;
  switch(platform) {
    case 'twitter': openUrl(`https://twitter.com/intent/tweet?text=${encodeURIComponent(t)}&url=${encodeURIComponent(SHARE_URL)}`); break;
    case 'kakao': openUrl(`https://story.kakao.com/share?url=${encodeURIComponent(SHARE_URL)}`); break;
    case 'telegram': openUrl(`https://t.me/share/url?url=${encodeURIComponent(SHARE_URL)}&text=${encodeURIComponent(t)}`); break;
    case 'instagram': doCopy(SHARE_URL); showToast('링크가 복사되었습니다 — 인스타그램에 붙여넣기 하세요'); break;
    case 'copy': doCopy(SHARE_URL); showToast('링크가 복사되었습니다'); break;
  }
}
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }

// Init
document.addEventListener('DOMContentLoaded', () => {
  initControls();
  loadData(currentTicker);
  loadAllSignals(); // 이상 신호 병렬 로드
});

// ── 이상 신호: 전체 ETF 스캔
async function loadAllSignals() {
  const DAYS = 21; // 오늘 포함 21일 = 20일 평균 + 오늘
  const THRESHOLD = 2.0; // 평균 대비 배수 임계값

  // 전체 티커 목록 추출
  const allTickers = [];
  for (const tickers of Object.values(ETF_LIST)) {
    for (const [t, info] of Object.entries(tickers)) {
      allTickers.push({ ticker: t, ...info });
    }
  }

  // 병렬 fetch
  const results = await Promise.allSettled(
    allTickers.map(async ({ ticker, name_kr }) => {
      try {
        const resp = await fetch(`data/prices/${ticker}.csv`);
        if (!resp.ok) return null;
        const text = await resp.text();
        const rows = Papa.parse(text, { header: true, dynamicTyping: true, skipEmptyLines: true })
          .data.filter(d => d.Date && d.Close);
        if (rows.length < DAYS + 2) return null;

        // 마지막 DAYS일 슬라이스
        const slice = rows.slice(-(DAYS + 1));
        const daily = [];
        for (let i = 1; i < slice.length; i++) {
          const p = slice[i-1], c = slice[i];
          const dir = c.Close > p.Close ? 1 : c.Close < p.Close ? -1 : 0;
          daily.push((c.Volume * c.Close * dir) / 1e6);
        }
        if (daily.length < 2) return null;

        const today = daily[daily.length - 1];
        const avg20 = daily.slice(0, -1).reduce((s, v) => s + Math.abs(v), 0) / (daily.length - 1);
        if (avg20 === 0) return null;

        const mult = Math.abs(today) / avg20;
        return { ticker, name_kr, today, avg20, mult };
      } catch { return null; }
    })
  );

  // 유효 결과 필터
  const signals = results
    .filter(r => r.status === 'fulfilled' && r.value && r.value.mult >= THRESHOLD)
    .map(r => r.value)
    .sort((a, b) => b.mult - a.mult);

  const outflows = signals.filter(s => s.today < 0).sort((a, b) => b.mult - a.mult);
  const inflows  = signals.filter(s => s.today > 0).sort((a, b) => b.mult - a.mult);

  renderSignals('signalOut', outflows, 'out');
  renderSignals('signalIn',  inflows,  'in');
}

function renderSignals(containerId, items, dir) {
  const el = document.getElementById(containerId);
  if (!items.length) {
    el.innerHTML = '<div class="signal-empty">이상 신호 없음</div>';
    return;
  }
  el.innerHTML = items.slice(0, 6).map(({ ticker, name_kr, today, mult }) => {
    const sign = today >= 0 ? '+' : '';
    const cls  = dir === 'out' ? 'red' : 'green';
    const fmt  = v => Math.abs(v) >= 1000 ? `${(v/1000).toFixed(1)}B` : `${v.toFixed(0)}M`;
    return `
      <div class="signal-item" onclick="jumpToTicker('${ticker}')">
        <div class="signal-item-left">
          <span class="signal-ticker">${ticker}</span>
          <span class="signal-name">${name_kr}</span>
        </div>
        <div class="signal-item-right">
          <span class="signal-flow ${cls}">${sign}${fmt(today)}</span>
          <span class="signal-mult ${cls}">평소의 ${mult.toFixed(1)}배</span>
        </div>
      </div>`;
  }).join('');
}

// 티커 클릭 시 해당 ETF로 바로 이동
function jumpToTicker(ticker) {
  // 카테고리 찾기
  for (const [cat, tickers] of Object.entries(ETF_LIST)) {
    if (tickers[ticker]) {
      document.getElementById('categorySelect').value = cat;
      // 드롭다운 업데이트 후 ticker 선택
      populateTickers(cat);
      const sel = document.getElementById('tickerSelect');
      sel.value = ticker;
      loadData(ticker);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
  }
}

function initControls() {
  const catSelect = document.getElementById('categorySelect'), tickerSelect = document.getElementById('tickerSelect');
  for (const cat of Object.keys(ETF_LIST)) { const o = document.createElement('option'); o.value = cat; o.textContent = cat; catSelect.appendChild(o); }
  catSelect.addEventListener('change', () => { populateTickers(catSelect.value); loadData(tickerSelect.value); });
  tickerSelect.addEventListener('change', () => loadData(tickerSelect.value));
  populateTickers('all');
  document.querySelectorAll('.window-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.window-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active'); currentDays = parseInt(btn.dataset.days);
      if (allPriceData) renderCharts();
    });
  });
}

function populateTickers(category) {
  const sel = document.getElementById('tickerSelect'); sel.innerHTML = '';
  const makeBadge = (official) => official ? ' [공식]' : ' [추정]';
  if (category === 'all') {
    for (const [cat, tickers] of Object.entries(ETF_LIST)) {
      const g = document.createElement('optgroup'); g.label = cat;
      for (const [t, info] of Object.entries(tickers)) {
        const o = document.createElement('option'); o.value = t;
        o.textContent = `${t} — ${info.name_kr}${makeBadge(info.official)}`;
        if (t === currentTicker) o.selected = true;
        g.appendChild(o);
      }
      sel.appendChild(g);
    }
  } else {
    for (const [t, info] of Object.entries(ETF_LIST[category] || {})) {
      const o = document.createElement('option'); o.value = t;
      o.textContent = `${t} — ${info.name_kr}${makeBadge(info.official)}`;
      sel.appendChild(o);
    }
  }
}

// Data
async function loadData(ticker) {
  currentTicker = ticker;
  try {
    const resp = await fetch(`data/prices/${ticker}.csv`);
    if (!resp.ok) return;
    const text = await resp.text();
    allPriceData = Papa.parse(text, { header: true, dynamicTyping: true, skipEmptyLines: true }).data.filter(d => d.Date && d.Close);
    if (allPriceData.length) document.getElementById('lastUpdated').textContent = `Last updated: ${allPriceData[allPriceData.length - 1].Date}`;
    renderCharts();
  } catch (err) { console.error(err); }
}

function calculateDailyFlow(data) {
  const r = [];
  for (let i = 1; i < data.length; i++) {
    const p = data[i-1], c = data[i], dir = c.Close > p.Close ? 1 : c.Close < p.Close ? -1 : 0;
    r.push({ date: c.Date, close: c.Close, dailyFlow: (c.Volume * c.Close * dir) / 1e6 });
  }
  return r;
}

function cumulativeFlow(df) { let s = 0; return df.map(d => { s += d.dailyFlow; return { ...d, cumFlow: s }; }); }

function detectDivergence(data) {
  if (data.length < 10) return null;
  const h = Math.floor(data.length / 2), f = data.slice(0, h), s = data.slice(h);
  const pD = (s[s.length-1].close - f[f.length-1].close) / f[f.length-1].close;
  const fD = s[s.length-1].cumFlow - f[f.length-1].cumFlow;
  if (Math.abs(pD) < 0.02) return null;
  if (pD > 0.02 && fD < 0) return { type: 'bearish', message: `Bearish Divergence: 가격 +${(pD*100).toFixed(1)}% 상승 중이나 fund flow 감소 — 스마트머니 이탈 가능성` };
  if (pD < -0.02 && fD > 0) return { type: 'bullish', message: `Bullish Divergence: 가격 ${(pD*100).toFixed(1)}% 하락 중이나 fund flow 증가 — 저가 매수 유입 가능성` };
  return null;
}

// Render
function renderCharts() {
  if (!allPriceData || !allPriceData.length) return;
  let sliced = currentDays === 0 ? allPriceData : allPriceData.slice(-currentDays - 1);
  const daily = calculateDailyFlow(sliced);
  if (!daily.length) return;
  const cum = cumulativeFlow(daily);
  updateInfoBar(cum); updateDivergence(cum);

  const wl = document.querySelector('.window-btn.active')?.textContent || '';
  const labels = cum.map(d => d.date), prices = cum.map(d => d.close), flows = cum.map(d => d.dailyFlow);
  const step = Math.max(1, Math.floor(labels.length / 40));
  const dl = labels.map((l, i) => i % step === 0 ? l : '');
  const tn = findTickerName(currentTicker);
  const official = isOfficial(currentTicker);
  const badgeHtml = official
    ? '<span class="badge badge-official">공식</span>'
    : '<span class="badge badge-estimated">추정</span>';

  document.getElementById('priceChartTitle').innerHTML = `${currentTicker} (${tn}) — 가격 ${badgeHtml}`;
  if (priceChart) priceChart.destroy();
  priceChart = new Chart(document.getElementById('priceChart').getContext('2d'), {
    type: 'line',
    data: { labels: dl, datasets: [{ data: prices, borderColor: '#22d3ee', borderWidth: 1.5, pointRadius: 0, pointHoverRadius: 3, tension: 0, fill: false }] },
    options: mkOpts(labels, v => '$' + v.toFixed(v >= 100 ? 0 : 2))
  });

  document.getElementById('flowChartTitle').innerHTML = `일별 Fund Flow — ${wl} (백만$) ${badgeHtml}`;
  if (flowChart) flowChart.destroy();
  flowChart = new Chart(document.getElementById('flowChart').getContext('2d'), {
    type: 'bar',
    data: { labels: dl, datasets: [{ data: flows, backgroundColor: flows.map(f => f >= 0 ? 'rgba(34,197,94,0.4)' : 'rgba(239,68,68,0.4)'), borderColor: flows.map(f => f >= 0 ? 'rgba(34,197,94,0.8)' : 'rgba(239,68,68,0.8)'), borderWidth: 1, barPercentage: 1.0, categoryPercentage: 1.0 }] },
    options: mkOpts(labels, v => (v >= 0 ? '+' : '') + v.toFixed(0) + 'M', true)
  });
}

function mkOpts(fl, yCb, isBar) {
  return {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false, backgroundColor: '#18181b', titleColor: '#888', bodyColor: '#e8e8f0', borderColor: '#333', borderWidth: 1, titleFont: { family: "'JetBrains Mono'" }, bodyFont: { family: "'JetBrains Mono'" }, callbacks: { title: i => fl[i[0].dataIndex], label: i => isBar ? `${i.raw >= 0 ? '+' : ''}${i.raw.toFixed(1)}M` : `$${i.raw.toFixed(2)}` } } },
    scales: { x: { grid: { color: '#1a1a1a', drawBorder: false }, ticks: { color: '#52525b', font: { family: "'JetBrains Mono'", size: 10 }, maxRotation: 0 } }, y: { position: 'right', grid: { color: '#1a1a1a', drawBorder: false }, ticks: { color: '#52525b', font: { family: "'JetBrains Mono'", size: 10 }, callback: yCb } } },
    interaction: { mode: 'index', intersect: false }
  };
}

// Helpers
function updateInfoBar(data) {
  if (!data || data.length < 2) return;
  const l = data[data.length-1], p = data[data.length-2], f = data[0];
  const dc = l.close - p.close, dp = (dc/p.close)*100, s = dc >= 0 ? '+' : '';
  document.getElementById('infoPrice').textContent = `$${l.close.toFixed(2)}`;
  const de = document.getElementById('infoDayChange'); de.textContent = `${s}${dc.toFixed(2)} (${s}${dp.toFixed(2)}%)`; de.className = `value ${dc >= 0 ? 'positive' : 'negative'}`;
  const fe = document.getElementById('infoFlow'), fs = l.cumFlow >= 0 ? '+' : ''; fe.textContent = `${fs}${l.cumFlow.toFixed(1)}M`; fe.className = `value ${l.cumFlow >= 0 ? 'positive' : 'negative'}`;
  document.getElementById('infoRange').textContent = `${f.date} ~ ${l.date}`;
}

function updateDivergence(data) {
  const a = document.getElementById('divergenceAlert'), d = detectDivergence(data);
  if (d) { a.className = `divergence-alert ${d.type}`; document.getElementById('divergenceText').textContent = d.message; } else { a.className = 'divergence-alert'; }
}

function findTickerInfo(t) { for (const v of Object.values(ETF_LIST)) { if (v[t]) return v[t]; } return { name_kr: t, official: false }; }
function findTickerName(t) { return findTickerInfo(t).name_kr; }
function isOfficial(t) { return findTickerInfo(t).official; }
</script>
