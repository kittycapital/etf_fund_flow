<html lang="ko">
<head>

<style>
:root {
  --bg-primary: #000000;
  --bg-card: #0d0d0d;
  --bg-hover: #1a1a1a;
  --border: #1a1a1a;
  --text-primary: #e8e8f0;
  --text-secondary: #888888;
  --text-muted: #555555;
  --accent-cyan: #22d3ee;
  --accent-green: #22c55e;
  --accent-red: #ef4444;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
::-webkit-scrollbar { display: none; }
* { -ms-overflow-style: none; scrollbar-width: none; }
html, body { overflow-x: hidden; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}

.container { max-width: 1400px; margin: 0 auto; padding: 20px; }

.header {
  text-align: center;
  padding: 30px 0 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
}
.header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.header .subtitle { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); margin-top: 6px; }

.controls {
  display: flex; gap: 16px; margin-bottom: 24px;
  flex-wrap: wrap; align-items: flex-end; justify-content: center;
}
.control-group { display: flex; flex-direction: column; gap: 6px; }
.control-group label {
  font-size: 11px; font-weight: 500; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.5px; text-align: center;
}
.control-group select {
  font-family: 'JetBrains Mono', monospace; font-size: 13px;
  padding: 8px 12px; background: var(--bg-card); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 6px; cursor: pointer; min-width: 180px;
}
.control-group select:focus { outline: none; border-color: var(--accent-cyan); }

.window-buttons { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.window-btn {
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  padding: 8px 14px; background: var(--bg-card); color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: all 0.15s;
}
.window-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.window-btn.active { background: var(--accent-cyan); color: #000; border-color: var(--accent-cyan); font-weight: 600; }

.info-bar {
  display: flex; gap: 24px; margin-bottom: 20px; padding: 12px 16px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
  flex-wrap: wrap; justify-content: center;
}
.info-item { display: flex; flex-direction: column; gap: 2px; align-items: center; }
.info-item .label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.info-item .value { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; }
.info-item .value.positive { color: var(--accent-green); }
.info-item .value.negative { color: var(--accent-red); }

.divergence-alert {
  display: none; margin-bottom: 16px; padding: 10px 16px; border-radius: 8px;
  font-size: 13px; font-weight: 500; align-items: center; gap: 8px; justify-content: center;
}
.divergence-alert.bullish { display: flex; background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.25); color: var(--accent-green); }
.divergence-alert.bearish { display: flex; background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); color: var(--accent-red); }

.chart-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
.chart-title { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.chart-title .dot { width: 8px; height: 8px; border-radius: 50%; }
.chart-title .dot.cyan { background: var(--accent-cyan); }
.chart-title .dot.green { background: var(--accent-green); }
.chart-wrapper { position: relative; height: 300px; }

.flow-legend { display: flex; gap: 16px; margin-top: 8px; font-size: 11px; color: var(--text-muted); justify-content: center; }
.flow-legend span { display: flex; align-items: center; gap: 4px; }
.flow-legend .box { width: 12px; height: 12px; border-radius: 2px; }
.flow-legend .box.inflow { background: rgba(34,197,94,0.4); border: 1px solid var(--accent-green); }
.flow-legend .box.outflow { background: rgba(239,68,68,0.4); border: 1px solid var(--accent-red); }

.share-group { display: flex; justify-content: center; gap: 8px; margin: 20px 0; }
.share-btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
  border: 1px solid var(--border); border-radius: 20px; background: var(--bg-card);
  color: var(--text-secondary); font-family: 'Noto Sans KR', sans-serif; font-size: 12px;
  cursor: pointer; transition: all 0.15s; text-decoration: none;
}
.share-btn:hover { border-color: var(--text-secondary); color: var(--text-primary); }
.share-btn svg { width: 14px; height: 14px; fill: currentColor; }
.share-btn.twitter:hover { color: #1da1f2; border-color: #1da1f2; }
.share-btn.kakao:hover { color: #fee500; border-color: #fee500; }
.share-btn.telegram:hover { color: #26a5e4; border-color: #26a5e4; }
.share-btn.instagram:hover { color: #e4405f; border-color: #e4405f; }
.share-btn.copy:hover { color: var(--accent-cyan); border-color: var(--accent-cyan); }

.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: #222; color: #fff; padding: 10px 24px; border-radius: 8px; font-size: 13px;
  z-index: 9999; opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

.data-note {
  margin-top: 20px; padding: 12px 16px; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: 8px; font-size: 11px;
  color: var(--text-muted); line-height: 1.6; text-align: center;
}
.data-note strong { color: var(--text-secondary); }

.footer { margin-top: 32px; padding: 16px 0; border-top: 1px solid var(--border); text-align: center; font-size: 11px; color: var(--text-muted); }

@media (max-width: 768px) {
  .container { padding: 12px; }
  .controls { flex-direction: column; align-items: center; }
  .control-group select { min-width: 100%; }
  .info-bar { flex-direction: column; gap: 12px; }
  .chart-wrapper { height: 220px; }
  .share-group { flex-wrap: wrap; }
  .share-btn { font-size: 11px; padding: 6px 10px; }
}
</style>
</head>

<script>
const SHARE_URL = 'https://herdvibe.com/92';

const ETF_LIST = {
  "미국 대표 지수": { SPY: "S&P 500", QQQ: "나스닥 100", DIA: "다우", IWM: "러셀 2000" },
  "섹터": { XLF: "금융", XLE: "에너지", XLK: "기술", XLV: "헬스케어", IGV: "소프트웨어", SMH: "반도체", SOXX: "반도체", XBI: "바이오", ITB: "주택건설" },
  "테마/성장": { ARKK: "혁신", HACK: "사이버보안", TAN: "태양광", LIT: "리튬/배터리", BOTZ: "로봇/AI" },
  "커머디티": { GLD: "금", SLV: "은", USO: "원유", UNG: "천연가스", COPX: "구리", WEAT: "밀" },
  "채권": { TLT: "미국 장기채", HYG: "하이일드", LQD: "투자등급 회사채", EMB: "신흥국 채권" },
  "국가/지역": { EEM: "신흥국", FXI: "중국", EWJ: "일본", EWY: "한국", EWZ: "브라질", INDA: "인도" },
  "변동성/헷지": { VXX: "VIX", UVXY: "VIX 2배" }
};

// Watermark
const watermarkPlugin = {
  id: 'watermark',
  afterDraw(chart) {
    const ctx = chart.ctx;
    ctx.save();
    ctx.font = '40px JetBrains Mono';
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Herdvibe.com',
      (chart.chartArea.left + chart.chartArea.right) / 2,
      (chart.chartArea.top + chart.chartArea.bottom) / 2);
    ctx.restore();
  }
};
Chart.register(watermarkPlugin);

let currentTicker = 'SPY';
let currentDays = 63; // 0 = ALL
let allPriceData = null;
let priceChart = null;
let flowChart = null;

// ===== SHARE =====
function openUrl(url) {
  try {
    const a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  } catch(e) { try { window.open(url, '_blank'); } catch(e2) {} }
}
function doCopy(text) {
  try { if (window.top?.navigator?.clipboard) { window.top.navigator.clipboard.writeText(text); return; } } catch(e) {}
  try { if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text); return; } } catch(e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;left:0;top:0;opacity:0;width:1px;height:1px;';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, ta.value.length);
    document.execCommand('copy'); document.body.removeChild(ta);
  } catch(e) { window.prompt('아래 링크를 복사하세요:', text); }
}
function doShare(platform) {
  const t = `${currentTicker} (${findTickerName(currentTicker)}) ETF 자금 유입 트래커 - Herdvibe`;
  switch(platform) {
    case 'twitter': openUrl(`https://twitter.com/intent/tweet?text=${encodeURIComponent(t)}&url=${encodeURIComponent(SHARE_URL)}`); break;
    case 'kakao': openUrl(`https://story.kakao.com/share?url=${encodeURIComponent(SHARE_URL)}`); break;
    case 'telegram': openUrl(`https://t.me/share/url?url=${encodeURIComponent(SHARE_URL)}&text=${encodeURIComponent(t)}`); break;
    case 'instagram': doCopy(SHARE_URL); openUrl('https://www.instagram.com/'); showToast('링크가 복사되었습니다 — 인스타그램 스토리에 붙여넣기 하세요'); break;
    case 'copy': doCopy(SHARE_URL); showToast('링크가 복사되었습니다'); break;
  }
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', () => {
  initControls();
  loadData(currentTicker);
});

function initControls() {
  const catSelect = document.getElementById('categorySelect');
  const tickerSelect = document.getElementById('tickerSelect');

  for (const cat of Object.keys(ETF_LIST)) {
    const opt = document.createElement('option');
    opt.value = cat; opt.textContent = cat;
    catSelect.appendChild(opt);
  }
  catSelect.addEventListener('change', () => { populateTickers(catSelect.value); loadData(tickerSelect.value); });
  tickerSelect.addEventListener('change', () => loadData(tickerSelect.value));
  populateTickers('all');

  document.querySelectorAll('.window-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.window-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentDays = parseInt(btn.dataset.days);
      if (allPriceData) renderCharts();
    });
  });
}

function populateTickers(category) {
  const sel = document.getElementById('tickerSelect');
  sel.innerHTML = '';
  if (category === 'all') {
    for (const [cat, tickers] of Object.entries(ETF_LIST)) {
      const g = document.createElement('optgroup'); g.label = cat;
      for (const [t, n] of Object.entries(tickers)) {
        const o = document.createElement('option'); o.value = t; o.textContent = `${t} — ${n}`;
        if (t === currentTicker) o.selected = true;
        g.appendChild(o);
      }
      sel.appendChild(g);
    }
  } else {
    for (const [t, n] of Object.entries(ETF_LIST[category] || {})) {
      const o = document.createElement('option'); o.value = t; o.textContent = `${t} — ${n}`;
      sel.appendChild(o);
    }
  }
}

// ===== DATA =====
async function loadData(ticker) {
  currentTicker = ticker;
  try {
    const resp = await fetch(`data/prices/${ticker}.csv`);
    if (!resp.ok) { console.error(`${ticker}.csv not found`); return; }
    const text = await resp.text();
    const parsed = Papa.parse(text, { header: true, dynamicTyping: true, skipEmptyLines: true });
    allPriceData = parsed.data.filter(d => d.Date && d.Close);
    if (allPriceData.length > 0) {
      document.getElementById('lastUpdated').textContent = `Last updated: ${allPriceData[allPriceData.length - 1].Date}`;
    }
    renderCharts();
  } catch (err) { console.error('Load failed:', err); }
}

// ===== FUND FLOW =====
function calculateDailyFlow(data) {
  const result = [];
  for (let i = 1; i < data.length; i++) {
    const prev = data[i - 1], curr = data[i];
    const dir = curr.Close > prev.Close ? 1 : curr.Close < prev.Close ? -1 : 0;
    result.push({
      date: curr.Date,
      close: curr.Close,
      dailyFlow: (curr.Volume * curr.Close * dir) / 1e6
    });
  }
  return result;
}

function cumulativeFlow(dailyFlows) {
  let sum = 0;
  return dailyFlows.map(d => {
    sum += d.dailyFlow;
    return { ...d, cumFlow: sum };
  });
}

// ===== DIVERGENCE =====
function detectDivergence(data) {
  if (data.length < 10) return null;
  const half = Math.floor(data.length / 2);
  const first = data.slice(0, half);
  const second = data.slice(half);

  const pFirst = first[first.length - 1].close, pSecond = second[second.length - 1].close;
  const fFirst = first[first.length - 1].cumFlow, fSecond = second[second.length - 1].cumFlow;
  const pDir = (pSecond - pFirst) / pFirst;
  const fDir = fSecond - fFirst;

  if (Math.abs(pDir) < 0.02) return null;
  if (pDir > 0.02 && fDir < 0) return { type: 'bearish', message: `Bearish Divergence: 가격 +${(pDir*100).toFixed(1)}% 상승 중이나 fund flow 감소 — 스마트머니 이탈 가능성` };
  if (pDir < -0.02 && fDir > 0) return { type: 'bullish', message: `Bullish Divergence: 가격 ${(pDir*100).toFixed(1)}% 하락 중이나 fund flow 증가 — 저가 매수 유입 가능성` };
  return null;
}

// ===== RENDER =====
function renderCharts() {
  if (!allPriceData || !allPriceData.length) return;

  // 기간에 따라 데이터 슬라이스
  let slicedPrice;
  if (currentDays === 0) {
    slicedPrice = allPriceData; // ALL
  } else {
    slicedPrice = allPriceData.slice(-currentDays - 1); // +1 for prev day calc
  }

  // 일별 flow 계산
  const dailyFlows = calculateDailyFlow(slicedPrice);
  if (!dailyFlows.length) return;

  // 누적 flow
  const cumData = cumulativeFlow(dailyFlows);

  updateInfoBar(cumData);
  updateDivergence(cumData);

  const windowLabel = document.querySelector('.window-btn.active')?.textContent || '';
  const labels = cumData.map(d => d.date);
  const prices = cumData.map(d => d.close);
  const flows = cumData.map(d => d.dailyFlow);

  // 날짜 라벨 간격
  const maxLabels = 40;
  const step = Math.max(1, Math.floor(labels.length / maxLabels));
  const displayLabels = labels.map((l, i) => i % step === 0 ? l : '');

  const tickerName = findTickerName(currentTicker);

  // ---- Price Chart ----
  document.getElementById('priceChartTitle').textContent = `${currentTicker} (${tickerName}) — 가격`;
  if (priceChart) priceChart.destroy();
  priceChart = new Chart(document.getElementById('priceChart').getContext('2d'), {
    type: 'line',
    data: {
      labels: displayLabels,
      datasets: [{
        data: prices, borderColor: '#22d3ee', borderWidth: 1.5,
        pointRadius: 0, pointHoverRadius: 3, tension: 0, fill: false
      }]
    },
    options: chartOptions(labels, v => '$' + v.toFixed(v >= 100 ? 0 : 2))
  });

  // ---- Flow Chart (bar) ----
  document.getElementById('flowChartTitle').textContent = `일별 Fund Flow — ${windowLabel} (백만$)`;
  if (flowChart) flowChart.destroy();
  flowChart = new Chart(document.getElementById('flowChart').getContext('2d'), {
    type: 'bar',
    data: {
      labels: displayLabels,
      datasets: [{
        data: flows,
        backgroundColor: flows.map(f => f >= 0 ? 'rgba(34,197,94,0.4)' : 'rgba(239,68,68,0.4)'),
        borderColor: flows.map(f => f >= 0 ? 'rgba(34,197,94,0.8)' : 'rgba(239,68,68,0.8)'),
        borderWidth: 1, barPercentage: 1.0, categoryPercentage: 1.0
      }]
    },
    options: chartOptions(labels, v => (v >= 0 ? '+' : '') + v.toFixed(0) + 'M', true)
  });
}

function chartOptions(fullLabels, yCallback, isBar) {
  return {
    responsive: true, maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        mode: 'index', intersect: false,
        backgroundColor: '#18181b', titleColor: '#888', bodyColor: '#e8e8f0',
        borderColor: '#333', borderWidth: 1,
        titleFont: { family: "'JetBrains Mono'" }, bodyFont: { family: "'JetBrains Mono'" },
        callbacks: {
          title: (items) => fullLabels[items[0].dataIndex],
          label: (item) => {
            if (isBar) return `${item.raw >= 0 ? '+' : ''}${item.raw.toFixed(1)}M`;
            return `$${item.raw.toFixed(2)}`;
          }
        }
      }
    },
    scales: {
      x: { grid: { color: '#1a1a1a', drawBorder: false }, ticks: { color: '#52525b', font: { family: "'JetBrains Mono'", size: 10 }, maxRotation: 0 } },
      y: { position: 'right', grid: { color: '#1a1a1a', drawBorder: false }, ticks: { color: '#52525b', font: { family: "'JetBrains Mono'", size: 10 }, callback: yCallback } }
    },
    interaction: { mode: 'index', intersect: false }
  };
}

// ===== HELPERS =====
function updateInfoBar(data) {
  if (!data || data.length < 2) return;
  const last = data[data.length - 1], prev = data[data.length - 2], first = data[0];
  const dc = last.close - prev.close, dcp = (dc / prev.close) * 100, s = dc >= 0 ? '+' : '';

  document.getElementById('infoPrice').textContent = `$${last.close.toFixed(2)}`;
  const dayEl = document.getElementById('infoDayChange');
  dayEl.textContent = `${s}${dc.toFixed(2)} (${s}${dcp.toFixed(2)}%)`;
  dayEl.className = `value ${dc >= 0 ? 'positive' : 'negative'}`;

  // 구간 내 누적 flow
  const totalFlow = last.cumFlow;
  const fs = totalFlow >= 0 ? '+' : '';
  const flowEl = document.getElementById('infoFlow');
  flowEl.textContent = `${fs}${totalFlow.toFixed(1)}M`;
  flowEl.className = `value ${totalFlow >= 0 ? 'positive' : 'negative'}`;

  document.getElementById('infoRange').textContent = `${first.date} ~ ${last.date}`;
}

function updateDivergence(data) {
  const alert = document.getElementById('divergenceAlert');
  const div = detectDivergence(data);
  if (div) {
    alert.className = `divergence-alert ${div.type}`;
    document.getElementById('divergenceText').textContent = div.message;
  } else {
    alert.className = 'divergence-alert';
  }
}

function findTickerName(ticker) {
  for (const tickers of Object.values(ETF_LIST)) { if (tickers[ticker]) return tickers[ticker]; }
  return ticker;
}
</script>
